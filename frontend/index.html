<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Document Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- =========================================
             MOBILE MENU BUTTON
             ========================================= -->

        <button
            id="mobile-menu-btn"
            class="mobile-menu-btn"
            aria-label="Open chat history"
        >
            ☰
        </button>


        <!-- =========================================
             MOBILE SIDEBAR OVERLAY
             ========================================= -->

        <div
            id="sidebar-overlay"
            class="sidebar-overlay"
        ></div>


        <!-- =========================================
             SIDEBAR
             ========================================= -->

        <aside class="sidebar">

            <!-- Mobile close button -->

            <button
                id="mobile-close-btn"
                class="mobile-close-btn"
                aria-label="Close chat history"
            >
                ×
            </button>


            <div class="logo">
                🤖 AI Document Assistant
            </div>


            <button class="new-chat-btn">
                + New Chat
            </button>


            <div class="history">

                <h3>Chat History</h3>

                <div id="history-list">
                    <!-- Chat history will appear here -->
                </div>

            </div>

        </aside>


        <!-- =========================================
             MAIN CHAT AREA
             ========================================= -->

        <main class="main">

            <!-- Header -->

            <header class="header">

                <div>

                    <h1>
                        AI Document Assistant
                    </h1>

                    <p>
                        Ask questions about your uploaded documents
                    </p>

                </div>

            </header>


            <!-- =====================================
                 UPLOAD AREA
                 ===================================== -->

            <section class="upload-section">

                <label
                    for="file-input"
                    class="upload-btn"
                >
                    📄 Upload Document
                </label>


                <input
                    type="file"
                    id="file-input"
                    accept=".pdf,.txt,.docx"
                    hidden
                >


                <span id="upload-status">
                    Supported: PDF, TXT, DOCX
                </span>

            </section>


            <!-- =====================================
                 CHAT MESSAGES
                 ===================================== -->

            <section
                class="chat-container"
                id="chat-container"
            >

                <div class="welcome-message">

                    <h2>
                        👋 Welcome!
                    </h2>

                    <p>
                        Upload a document and ask me anything about it.
                    </p>

                </div>

            </section>


            <!-- =====================================
                 INPUT AREA
                 ===================================== -->

            <section class="input-section">

                <textarea
                    id="question-input"
                    placeholder="Ask something about your document..."
                    rows="1"
                ></textarea>


                <button
                    id="send-btn"
                    class="send-btn"
                >
                    ➤
                </button>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
