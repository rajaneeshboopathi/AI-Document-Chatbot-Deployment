<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Document Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                🤖 AI Document Assistant
            </div>

            <button class="new-chat-btn">
                + New Chat
            </button>

            <div class="history">

                <h3>Chat History</h3>

                <div id="history-list">
                    <!-- Chat history will appear here -->
                </div>

            </div>

        </aside>


        <!-- Main Chat Area -->
        <main class="main">

            <!-- Header -->
            <header class="header">

                <div>
                    <h1>AI Document Assistant</h1>

                    <p>
                        Ask questions about your uploaded documents
                    </p>
                </div>

            </header>


            <!-- Upload Area -->
            <section class="upload-section">

                <label for="file-input" class="upload-btn">
                    📄 Upload Document
                </label>

                <input
                    type="file"
                    id="file-input"
                    accept=".pdf,.txt,.docx"
                    hidden
                >

                <span id="upload-status">
                    Supported: PDF, TXT, DOCX
                </span>

            </section>


            <!-- Chat Messages -->
            <section
                class="chat-container"
                id="chat-container"
            >

                <div class="welcome-message">

                    <h2>
                        👋 Welcome!
                    </h2>

                    <p>
                        Upload a document and ask me anything about it.
                    </p>

                </div>

            </section>


            <!-- Input Area -->
            <section class="input-section">

                <textarea
                    id="question-input"
                    placeholder="Ask something about your document..."
                    rows="1"
                ></textarea>

                <button
                    id="send-btn"
                    class="send-btn"
                >
                    ➤
                </button>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
